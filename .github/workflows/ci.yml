name: CI

# The quality gate in front of `main`.
#
# Deployment itself is NOT done here — Vercel's GitHub integration builds and
# promotes `main` on its own. That is deliberate: doing it here would mean
# putting a Vercel deploy token into GitHub secrets, and the integration needs
# no token at all. This workflow's job is to make sure what reaches `main` is
# worth deploying. See docs/DEPLOY-WEB.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN, applied to every job in this file.
#
# Without this block the token inherits the repository default, which is wider
# than anything here needs — these jobs only read code. A workflow that runs
# `npm ci` is executing third-party install scripts, so the token it exposes to
# them should be able to do as little as possible.
permissions:
  contents: read

jobs:
  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        # Node's own runner over TypeScript with the types stripped: no test
        # framework to install. See web/tests/alias.mjs for the `@/` paths.
        run: npm test

      - name: Lint
        # ⚠️ REPORTING ONLY, and this must not stay that way.
        #
        # The tree has 28 pre-existing lint errors — 25 of them
        # `react-hooks/set-state-in-effect` — and they are on `main` too, not
        # introduced by any one branch. Making this blocking today would mean
        # CI is red from its first run, and a permanently red gate is one
        # everybody learns to ignore, which is worse than not having it.
        #
        # It runs so the output is visible on every PR and the number can be
        # watched. Delete this line once the count reaches zero; the fixes are
        # per-file and several are genuine (a few sites read browser-only state
        # and legitimately carry a scoped disable with a reason — see the notes
        # in those files before "fixing" them).
        continue-on-error: true
        run: npm run lint

      - name: Build
        # Placeholder values only. `next build` needs these to exist because
        # the Supabase client is constructed at module scope, but nothing in
        # the build talks to the real project — and a CI run must never hold
        # production credentials it does not need.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

  site:
    name: Site — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # No git command after checkout needs it; install and build can't read it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking, unlike web's: the site starts clean, so keep it that way.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  mobile:
    name: Mobile — analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is developed against. Flutter's
          # analyzer gains rules between releases, so "stable" would turn an
          # unrelated Flutter upgrade into a red build on an untouched PR.
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # TZ=UTC matches the CI assumption the localDate test is written
        # against — see its comments. Do not remove without reading them.
        env:
          TZ: UTC
        run: flutter test

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # No git command after checkout needs it; install scripts can't read it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json

      - run: npm ci

      - name: Block on critical advisories
        # Gated at `critical`, not `high`, and that is a deliberate choice
        # rather than laziness.
        #
        # As of 22 October 2026, on next 16.4.2, neither the app nor the site
        # has a critical or moderate advisory. Both have the same single high
        # one: braces GHSA-vfj7-8cjw-p6xm, a stack-exhaustion DoS from deeply
        # nested brace patterns. npm counts every package on the path, so it
        # shows as 9 highs here and 5 in the site. `npm explain braces` traces
        # it through fast-glob <- micromatch <- braces to two roots:
        #
        #   shadcn              the component CLI, app only, three times over:
        #                       its own fast-glob, @shadcn/registry's, and
        #                       ts-morph <- @ts-morph/common's
        #   eslint-config-next  @next/eslint-plugin-next pins fast-glob 3.3.1,
        #                       app and site
        #
        # Neither runs in the deployed app: the app imports only shadcn's CSS,
        # and the patterns both tools expand come from their own code and our
        # config, never from a request. Every braces release is in the range
        # (<= 3.0.3, no patched version), so there is nothing to upgrade to;
        # the "fix" npm offers is a downgrade to shadcn 1.0.0 or
        # eslint-config-next 14.
        #
        # Sharp is not among them: next 16.4.2 brings sharp 0.35.5 and libvips
        # 1.3.4, and neither is flagged. The four highs this note named in
        # September (brace-expansion, fast-uri, js-yaml, nanoid) have all been
        # cleared by upgrades since.
        #
        # Gating at `high` would therefore fail every pull request until braces
        # ships a fix, and a permanently red gate is one everybody learns to
        # ignore — the same trap the lint step already fell into. Critical
        # passes today, so this blocks on the things that genuinely must stop a
        # merge, while the reports keep the highs visible.
        #
        # Raise this and the site's gate to `high` once braces publishes a fixed
        # version, or shadcn and eslint-config-next stop depending on it.
        run: npm audit --audit-level=critical

      - name: Report high and moderate advisories
        if: always()
        run: npm audit --audit-level=moderate || true

      # The site has its own lockfile, so it gets its own audit. Until October
      # 2026 it had none, and it sat on next 16.4.0, inside a critical range,
      # with nothing here to notice. These steps run even when the app's gate
      # above fails, so one red result never hides the other.
      #
      # Steps in this job rather than a second job or a matrix: branch
      # protection requires a check named exactly "Dependency audit", and a
      # matrix would rename it.
      - name: Install the site
        id: site_install
        if: ${{ !cancelled() }}
        working-directory: site
        # The audit reads the lockfile and the installed tree; it needs no
        # package's install script to have run, so none do.
        run: npm ci --ignore-scripts

      - name: Block on critical advisories in the site
        # Same gate, same reasoning as the app's above.
        if: ${{ !cancelled() && steps.site_install.outcome == 'success' }}
        working-directory: site
        run: npm audit --audit-level=critical

      - name: Report high and moderate advisories in the site
        if: ${{ !cancelled() && steps.site_install.outcome == 'success' }}
        working-directory: site
        run: npm audit --audit-level=moderate || true

  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base branch too, to see what the PR changes.
          fetch-depth: 0

      - name: Filenames are well formed and unique
        run: |
          set -euo pipefail
          cd supabase/migrations
          fail=0
          for f in *.sql; do
            # `[a-z0-9]+(_[a-z0-9]+)*` rather than `[a-z0-9_]+`: the latter also
            # accepts `__double.sql` and `trailing_.sql`, which are not
            # snake_case. Verified against all 71 existing files (none rejected)
            # and against both bad forms (both rejected).
            if ! [[ "$f" =~ ^[0-9]{14}_[a-z0-9]+(_[a-z0-9]+)*\.sql$ ]]; then
              echo "::error file=supabase/migrations/$f::Bad migration filename. Expected <14-digit version>_<snake_case_name>.sql"
              fail=1
            fi
          done
          dupes=$(ls *.sql | cut -c1-14 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration versions: $dupes"
            fail=1
          fi
          echo "Checked $(ls *.sql | wc -l) migration files."
          exit $fail

      - name: Applied migrations must not be edited or deleted
        # An applied migration is a historical record of what production ran.
        # Editing one makes the repo disagree with the database *silently* —
        # every environment built afterwards gets a schema nobody has run.
        # New migrations are how the schema changes; old ones are immutable.
        #
        # A pure rename is reported, not blocked: correcting a filename to match
        # the recorded version is a legitimate repair (see supabase/README.md),
        # and it is visible in the PR diff for a human to judge.
        #
        # `--find-renames=100%` is load-bearing, not tidiness. With git's default
        # similarity detection, a file that is renamed *and edited* is reported
        # as `R` — so an edited migration would slip past the MD filter below and
        # be merely warned about, which is the exact hole this step exists to
        # close. Requiring an exact match means anything whose content changed
        # shows up as delete + add, and gets blocked.
        if: github.event_name == 'pull_request'
        env:
          # Passed through the environment rather than interpolated into the
          # script. A `${{ }}` expression is substituted into the shell source
          # before bash parses it, so a value containing shell metacharacters
          # would be executed rather than read.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          base="origin/$BASE_REF"
          changed=$(git diff --name-status --find-renames=100% --diff-filter=MD "$base"...HEAD -- supabase/migrations || true)
          if [ -n "$changed" ]; then
            echo "::error::This pull request edits or deletes migrations that are already applied:"
            echo "$changed"
            echo "Add a new migration instead. See supabase/README.md."
            exit 1
          fi
          renamed=$(git diff --name-status --find-renames=100% --diff-filter=R "$base"...HEAD -- supabase/migrations || true)
          if [ -n "$renamed" ]; then
            echo "::warning::This PR renames migration files — confirm they match the recorded versions:"
            echo "$renamed"
          fi
          echo "No applied migration was edited or deleted."

  secrets:
    name: No secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credentials
        # Cheap, specific patterns rather than a general scanner: a service-role
        # JWT, an OpenAI key, a Google API key, or a keystore committed by
        # accident. Each of these has cost real projects a production incident.
        run: |
          set -euo pipefail
          if git grep -nIE \
              'service_role[^_a-z].*(eyJ[A-Za-z0-9_-]{20,})|sb_secret_[A-Za-z0-9]|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}' \
              -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::A credential-shaped string is committed. Rotate it, then remove it from the tree."
            exit 1
          fi
          if git ls-files | grep -E '\.(jks|keystore)$|key\.properties$'; then
            echo "::error::A signing keystore or its password file is committed. Rotate the key immediately."
            exit 1
          fi
          echo "No credential-shaped strings found."
